<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Login | ERP Demo</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container"><div class="card shadow mx-auto mt-5" style="max-width:420px"><div class="card-body p-4"><h3>ERP Demo</h3><p class="text-muted">Controle de Big Bags</p>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{c}}">{{m}}</div>{% endfor %}<form method="post"><label for="login-usuario" class="form-label">Usuário</label><input id="login-usuario" name="usuario" class="form-control mb-3" required><label for="login-senha" class="form-label">Senha</label><input id="login-senha" name="senha" type="password" class="form-control mb-3" required><button id="btn-login" class="btn btn-primary w-100">Entrar</button></form><small class="text-muted d-block mt-3">Demonstração local: admin / admin123</small></div></div></div></body></html>
